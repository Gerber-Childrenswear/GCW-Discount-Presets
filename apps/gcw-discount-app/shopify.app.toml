embedded = true

[webhooks]
api_version = "2025-07"

  [[webhooks.subscriptions]]
  topics = [ "orders/create", "orders/updated" ]
  uri = "/api/webhooks/orders"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_discounts,read_orders,read_products,write_discounts,read_metafields,write_metafields"

[auth]
redirect_urls = [ "https://gcw-discount-presets-v2.onrender.com/api/auth/callback" ]
